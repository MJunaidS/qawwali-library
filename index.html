<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qawwali Library</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0c0a06; --surface:#13100a; --surface2:#1c1710;
  --border:rgba(193,154,72,0.2); --gold:#c19a48; --gold-light:#e8c97a;
  --gold-dim:rgba(193,154,72,0.1); --text:#e8dcc8; --muted:#8a7a5a;
  --lyric:#4a9e6a; --alap:#9a5ec8; --instr:#c85e5e; --tarana:#5e8ac8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Libre Baskerville',serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 30%,rgba(193,154,72,.04) 0%,transparent 55%);pointer-events:none;z-index:0;}

header{text-align:center;padding:2.5rem 1rem 2rem;border-bottom:1px solid var(--border);position:relative;z-index:1;}
.ornament{font-size:1.3rem;color:var(--gold);letter-spacing:.6em;display:block;margin-bottom:.4rem;opacity:.7;}
h1{font-family:'Cinzel',serif;font-size:2rem;font-weight:400;color:var(--gold-light);letter-spacing:.2em;}
.tagline{color:var(--muted);font-size:.88rem;font-style:italic;margin-top:.3rem;}

.view{display:none;position:relative;z-index:1;}
.view.active{display:block;}

/* LIBRARY */
.library-grid{max-width:1000px;margin:2.5rem auto;padding:0 1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem;}
.empty-state{max-width:500px;margin:5rem auto;text-align:center;padding:0 1.5rem;}
.empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.4;}
.empty-title{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);letter-spacing:.1em;margin-bottom:.6rem;}
.empty-txt{color:var(--muted);font-size:.88rem;line-height:1.75;font-style:italic;}

.qawwali-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.3rem;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.qawwali-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(193,154,72,.04) 0%,transparent 60%);pointer-events:none;}
.qawwali-card:hover{border-color:rgba(193,154,72,.45);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4);}
.card-urdu-title{font-family:'Noto Nastaliq Urdu',serif;font-size:1.2rem;color:var(--gold-light);direction:rtl;text-align:right;margin-bottom:.5rem;line-height:1.6;}
.card-english-title{font-family:'Libre Baskerville',serif;font-size:.88rem;color:var(--muted);font-weight:400;}
.card-arrow{position:absolute;bottom:1rem;right:1rem;color:var(--gold);opacity:.4;font-size:1rem;}

/* QAWWALI VIEW */
.qawwali-view-inner{max-width:920px;margin:0 auto;padding:0 0 4rem;}
.qv-header{padding:1.5rem 1.5rem;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:.5rem;}
.qv-header-spacer{width:100%;}
.qv-title-block{text-align:center;}
.qv-urdu-title{font-family:'Noto Nastaliq Urdu',serif;font-size:2rem;color:var(--gold-light);direction:rtl;line-height:1.5;margin-bottom:1rem;text-align:center;}
.qv-ornament{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:1rem;}
.qv-ornament-line{width:40px;height:1px;background:rgba(193,154,72,0.3);}
.qv-ornament-star{color:rgba(193,154,72,0.5);font-size:.75rem;}
.qv-english-title{font-family:'Cinzel',serif;font-size:.95rem;color:var(--gold);opacity:.85;font-weight:400;margin-bottom:.4rem;text-align:center;}
.qv-meta{color:var(--muted);font-size:.78rem;font-family:'Libre Baskerville',serif;margin-top:.1rem;text-align:center;}
.qv-header-btn{display:flex;justify-content:flex-end;}
.btn-back{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:.45rem .9rem;font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .2s;flex-shrink:0;}
.btn-back:hover{border-color:var(--gold);color:var(--gold);}

/* Audio */
.audio-bar{border-bottom:1px solid var(--border);}
.yt-wrap{width:100%;max-width:760px;margin:0 auto;aspect-ratio:16/9;background:#000;}
.yt-meta{display:flex;align-items:center;justify-content:center;gap:1.5rem;padding:.6rem 1.5rem;}
.audio-track{flex:1;max-width:400px;height:3px;background:rgba(193,154,72,.15);border-radius:3px;cursor:pointer;position:relative;}
.audio-fill{height:100%;background:var(--gold);border-radius:3px;width:0%;pointer-events:none;transition:width .1s linear;}
.audio-time{font-size:.78rem;color:var(--muted);font-family:'Libre Baskerville',serif;white-space:nowrap;}
.yt-link{font-size:.75rem;color:var(--gold);opacity:.6;text-decoration:none;font-family:'Libre Baskerville',serif;white-space:nowrap;}
.yt-link:hover{opacity:1;}

/* Overview */
.overview-card{background:var(--surface);margin:1.2rem 1.5rem;border:1px solid var(--border);border-radius:10px;padding:1.2rem 1.4rem;}
.overview-lbl{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.2em;color:var(--gold);opacity:.7;text-transform:uppercase;margin-bottom:.6rem;}
.overview-txt{font-size:.92rem;line-height:1.9;color:var(--text);font-family:'Libre Baskerville',serif;}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:.8rem;padding:.5rem 1.5rem;border-bottom:1px solid var(--border);font-size:.75rem;font-family:'Libre Baskerville',serif;}
.legend-item{display:flex;align-items:center;gap:.35rem;color:var(--muted);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* Lyrics */
.lyrics-section{height:400px;overflow-y:auto;border-bottom:2px solid var(--border);padding:1.2rem 1.5rem;}
.ls-label{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.55;margin-bottom:.8rem;}
.lyric-row{display:flex;align-items:center;gap:.5rem;min-height:2.2rem;margin-bottom:.15rem;direction:rtl;max-width:620px;margin-left:auto;margin-right:auto;}
.lyric-text{flex:1;font-family:'Noto Nastaliq Urdu',serif;font-size:1.05rem;line-height:1.9;text-align:right;direction:rtl;padding:.05rem 0;border-radius:4px;transition:background .2s,color .2s;}
.lyric-text.active{background:rgba(193,154,72,.12);color:var(--gold-light);}
.tl-circle{width:13px;height:13px;border-radius:50%;border:2px solid;background:var(--bg);cursor:pointer;flex-shrink:0;transition:all .25s;}
.tl-circle:hover{transform:scale(1.35);}
.tl-circle.type-lyric{border-color:var(--lyric);}
.tl-circle.type-alap{border-color:var(--alap);}
.tl-circle.type-instrumental{border-color:var(--instr);}
.tl-circle.type-tarana{border-color:var(--tarana);}
.tl-circle.active{transform:scale(1.4);}
.tl-circle.type-lyric.active{background:var(--lyric);box-shadow:0 0 8px var(--lyric);}
.tl-circle.type-alap.active{background:var(--alap);box-shadow:0 0 8px var(--alap);}
.tl-circle.type-instrumental.active{background:var(--instr);box-shadow:0 0 8px var(--instr);}
.tl-circle.type-tarana.active{background:var(--tarana);box-shadow:0 0 8px var(--tarana);}
.lyric-sep{text-align:center;color:var(--muted);font-size:.75rem;letter-spacing:.4em;margin:.4rem 0;opacity:.35;display:block;direction:ltr;}
.music-row{display:flex;align-items:center;justify-content:flex-end;min-height:1.8rem;margin-bottom:.1rem;padding-right:.2rem;border-radius:4px;transition:background .2s;}
.music-row.active{background:rgba(193,154,72,.08);}
.music-row.active .music-label{color:var(--gold);opacity:.8;}
.music-label{font-size:.72rem;color:var(--muted);font-style:italic;font-family:'Libre Baskerville',serif;transition:color .2s;}

/* Analysis */
.analysis-body{padding:1.5rem;}
.sections-lbl{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.55;margin-bottom:1.2rem;}
.section-card{border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1.1rem;border-left:3px solid;background:var(--surface);scroll-margin-top:1rem;}
.section-card.type-lyric{border-color:var(--lyric);}
.section-card.type-alap{border-color:var(--alap);}
.section-card.type-instrumental{border-color:var(--instr);}
.section-card.type-tarana{border-color:var(--tarana);}
.card-hdr{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem;flex-wrap:wrap;}
.card-badge{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:.15rem .5rem;border-radius:20px;border:1px solid;}
.type-lyric .card-badge{color:var(--lyric);border-color:rgba(74,158,106,.3);background:rgba(74,158,106,.07);}
.type-alap .card-badge{color:var(--alap);border-color:rgba(154,94,200,.3);background:rgba(154,94,200,.07);}
.type-instrumental .card-badge{color:var(--instr);border-color:rgba(200,94,94,.3);background:rgba(200,94,94,.07);}
.type-tarana .card-badge{color:var(--tarana);border-color:rgba(94,138,200,.3);background:rgba(94,138,200,.07);}
.card-ts{font-size:.78rem;color:var(--muted);font-style:italic;font-family:'Libre Baskerville',serif;}
.card-urdu{font-family:'Noto Nastaliq Urdu',serif;font-size:1.1rem;line-height:1.9;margin-bottom:.35rem;text-align:right;direction:rtl;}
.card-roman{font-size:.82rem;color:var(--muted);margin-bottom:.35rem;font-family:'Libre Baskerville',serif;}
.card-trans{font-size:.92rem;color:var(--gold);font-style:italic;margin-bottom:.7rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);font-family:'Libre Baskerville',serif;}
.card-expl{font-size:.88rem;line-height:1.9;color:var(--text);font-family:'Libre Baskerville',serif;}

.loading{text-align:center;padding:4rem 1rem;color:var(--muted);font-style:italic;font-family:'Libre Baskerville',serif;}
</style>
</head>
<body>
<header>
  <span class="ornament">☽ ✦ ☾</span>
  <h1>Qawwali Library</h1>
  <p class="tagline">A collection of qawwali analyses</p>
</header>

<!-- LIBRARY VIEW -->
<div class="view active" id="libraryView">
  <div id="libraryContent"><div class="loading">Loading library...</div></div>
</div>

<!-- QAWWALI VIEW -->
<div class="view" id="qawwaliView">
  <div class="qawwali-view-inner">

    <div class="qv-header">
      <div class="qv-header-spacer"></div>
      <div class="qv-title-block">
        <div class="qv-urdu-title" id="qvUrduTitle"></div>
        <div class="qv-ornament" id="qvOrnament" style="display:none;">
          <div class="qv-ornament-line"></div>
          <span class="qv-ornament-star">✦</span>
          <div class="qv-ornament-line"></div>
        </div>
        <div class="qv-english-title" id="qvEnglishTitle"></div>
        <div class="qv-meta" id="qvMeta"></div>
      </div>
      <div class="qv-header-btn">
        <button class="btn-back" onclick="showLibrary()">← Library</button>
      </div>
    </div>

    <div class="audio-bar">
      <div class="yt-wrap">
        <div id="yt-embed-wrap" style="width:100%;height:100%;background:#000;"></div>
      </div>
      <div class="yt-meta">
        <div class="audio-track" id="audioTrack" onclick="seekAudio(event)">
          <div class="audio-fill" id="audioFill"></div>
        </div>
        <div class="audio-time" id="audioTime">0:00 / 0:00</div>
        <a id="ytExternalLink" class="yt-link" href="#" target="_blank">↗ YouTube</a>
      </div>
    </div>

    <div class="overview-card">
      <div class="overview-lbl">✦ Spiritual Overview</div>
      <div class="overview-txt" id="qvOverview"></div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--lyric)"></div>Lyrical</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--alap)"></div>Alaap</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--instr)"></div>Instrumental</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--tarana)"></div>Tarana</div>
    </div>

    <div class="lyrics-section">
      <div class="ls-label">Complete Lyrics &amp; Timeline</div>
      <div id="qvLyrics"></div>
    </div>

    <div class="analysis-body">
      <div class="sections-lbl">Section by Section Analysis</div>
      <div id="qvSections"></div>
    </div>
  </div>
</div>

<script>
const GITHUB_API = 'https://api.github.com/repos/MJunaidS/qawwali-library/contents/';
const GITHUB_RAW = 'https://raw.githubusercontent.com/MJunaidS/qawwali-library/main/';

let library = [];
let currentEntry = null;
let ytPlayer = null;
let ytUpdateInterval = null;
let ytDuration = 0;
let isPlaying = false;

// ── CLEAN FIELD HELPER ──
function clean(val) {
  if (!val) return '';
  const l = val.toLowerCase().trim();
  if (['unknown','to be confirmed','n/a','-','tbc',''].includes(l)) return '';
  return val.trim();
}

// ── LOAD LIBRARY via GitHub API ──
async function loadLibrary() {
  try {
    // Fetch directory listing from GitHub API
    const res = await fetch(GITHUB_API + '?t=' + Date.now(), {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error('GitHub API error: ' + res.status);
    const files = await res.json();

    // Filter to only .json files, excluding index.html and any non-qawwali files
    const qawwaliFiles = files.filter(f =>
      f.type === 'file' &&
      f.name.endsWith('.json') &&
      f.name !== 'library.json'
    );

    if (!qawwaliFiles.length) { library = []; renderLibrary(); return; }

    // Load each qawwali JSON file in parallel
    const results = await Promise.allSettled(
      qawwaliFiles.map(f => fetch(GITHUB_RAW + f.name).then(r => r.json()))
    );

    library = results
      .filter(r => r.status === 'fulfilled')
      .map(r => r.value);

    // Sort alphabetically by English title
    library.sort((a, b) => (a.english_title || '').localeCompare(b.english_title || ''));

    renderLibrary();
  } catch(e) {
    console.error('Failed to load library:', e);
    document.getElementById('libraryContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">☽</div>
        <div class="empty-title">Could not load library</div>
        <div class="empty-txt">${e.message}</div>
      </div>`;
  }
}

function renderLibrary() {
  const content = document.getElementById('libraryContent');
  if (!library.length) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">☽</div>
        <div class="empty-title">Library is Empty</div>
        <div class="empty-txt">No qawwali analyses have been published yet.</div>
      </div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'library-grid';

  library.forEach((entry, i) => {
    const card = document.createElement('div');
    card.className = 'qawwali-card';
    const englishTitle = clean(entry.english_title) || '';
    const artist = clean(entry.artist) || '';
    card.innerHTML = `
      <div class="card-urdu-title">${entry.urdu_title || entry.english_title || ''}</div>
      ${englishTitle ? `<div class="card-english-title">${englishTitle}${artist ? ' — ' + artist : ''}</div>` : ''}
      <div class="card-arrow">→</div>
    `;
    card.onclick = () => openQawwali(i);
    grid.appendChild(card);
  });

  content.innerHTML = '';
  content.appendChild(grid);
}

// ── OPEN QAWWALI ──
function openQawwali(idx) {
  currentEntry = library[idx];
  stopYT();
  document.getElementById('libraryView').classList.remove('active');
  document.getElementById('qawwaliView').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  try { renderQawwaliView(currentEntry); }
  catch(e) { console.error('renderQawwaliView error:', e); }
}

function showLibrary() {
  stopYT();
  document.getElementById('qawwaliView').classList.remove('active');
  document.getElementById('libraryView').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── RENDER QAWWALI VIEW ──
function renderQawwaliView(data) {
  // Header — only show fields with real content
  document.getElementById('qvUrduTitle').textContent = data.urdu_title || data.english_title || '';

  const englishTitle = clean(data.english_title) || '';
  const urduTitle = clean(data.urdu_title) || '';
  const hasEnglish = englishTitle && urduTitle;
  // Only show English title and ornament if we also have a Urdu title
  document.getElementById('qvEnglishTitle').textContent = hasEnglish ? englishTitle : '';
  document.getElementById('qvOrnament').style.display = hasEnglish ? 'flex' : 'none';

  const metaParts = [
    clean(data.artist),
    clean(data.poet) ? 'Poetry by ' + clean(data.poet) : ''
  ].filter(Boolean);
  document.getElementById('qvMeta').textContent = metaParts.join(' · ');

  document.getElementById('qvOverview').textContent = data.overall_summary || '';

  const ytLink = document.getElementById('ytExternalLink');
  if (ytLink && data.youtube_url) ytLink.href = data.youtube_url;

  const typeLabels = { lyric:'Lyrical', alap:'Alaap', instrumental:'Instrumental', tarana:'Tarana' };

  // Lyrics rows from timestamps
  const lyricsDiv = document.getElementById('qvLyrics');
  lyricsDiv.innerHTML = '';
  const timestamps = data.timestamps || [];

  timestamps.forEach((ts, idx) => {
    // Handle [music] markers
    if (ts.line === '[music]') {
      const musicRow = document.createElement('div');
      musicRow.className = 'music-row';
      musicRow.dataset.tsIdx = idx;
      musicRow.innerHTML = '<span class="music-label">· · · instrumental · · ·</span>';
      lyricsDiv.appendChild(musicRow);
      return;
    }

    const row = document.createElement('div');
    row.className = 'lyric-row';

    const text = document.createElement('span');
    text.className = 'lyric-text';
    text.textContent = ts.line;
    text.dataset.idx = idx;

    const secIdx = findSectionForLine(ts.line, data.sections);
    const sec = secIdx !== null ? data.sections[secIdx] : null;
    const type = sec ? sec.type : 'lyric';

    const circle = document.createElement('div');
    circle.className = `tl-circle type-${type}`;
    circle.title = typeLabels[type] || type;
    circle.onclick = () => scrollToCard(secIdx);

    row.appendChild(text);
    row.appendChild(circle);
    lyricsDiv.appendChild(row);
  });

  // Section cards
  const sectionsDiv = document.getElementById('qvSections');
  sectionsDiv.innerHTML = '';
  data.sections.forEach((sec, i) => {
    const type = sec.type || 'lyric';
    const card = document.createElement('div');
    card.className = `section-card type-${type}`;
    card.id = `qsec-${i}`;
    card.innerHTML = `
      <div class="card-hdr">
        <span class="card-badge">${typeLabels[type]||type}</span>
        <span class="card-ts">${sec.timestamp_hint||''}</span>
      </div>
      ${sec.urdu_text?`<div class="card-urdu">${sec.urdu_text}</div>`:''}
      ${sec.romanization?`<div class="card-roman">🔊 ${sec.romanization}</div>`:''}
      ${sec.translation?`<div class="card-trans">"${sec.translation}"</div>`:''}
      <div class="card-expl">${sec.explanation||''}</div>
    `;
    sectionsDiv.appendChild(card);
  });

  setupYT(data.youtube_url);
  document.getElementById('audioTime').textContent = '0:00 / 0:00';
  document.getElementById('audioFill').style.width = '0%';
}

function findSectionForLine(line, sections) {
  const key = normKey(line);
  if (!key || key === '[music]') return null;
  for (let i = 0; i < sections.length; i++) {
    const sec = sections[i];
    if (sec.urdu_text) {
      const lines = sec.urdu_text.split('\n').map(l => normKey(l));
      if (lines.some(sl => sl === key || (sl.length > 5 && (sl.includes(key) || key.includes(sl))))) return i;
    }
  }
  return null;
}

function normKey(line) {
  return (line||'').trim().replace(/\s+/g,' ').slice(0,60);
}

function scrollToCard(secIdx) {
  if (secIdx === null) return;
  const card = document.getElementById(`qsec-${secIdx}`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── YOUTUBE ──
function setupYT(url) {
  const videoId = extractVideoId(url);
  if (!videoId) return;

  const wrap = document.getElementById('yt-embed-wrap');
  wrap.innerHTML = '';
  const div = document.createElement('div');
  div.id = 'yt-player-inner';
  wrap.appendChild(div);

  if (!window.YT || !window.YT.Player) {
    if (!document.getElementById('yt-api-script')) {
      const tag = document.createElement('script');
      tag.id = 'yt-api-script';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
    window.onYouTubeIframeAPIReady = () => createYT(videoId);
  } else {
    createYT(videoId);
  }
}

function createYT(videoId) {
  if (ytPlayer) { try { ytPlayer.destroy(); } catch(e){} ytPlayer = null; }
  ytPlayer = new YT.Player('yt-player-inner', {
    videoId,
    width: '100%',
    height: '100%',
    playerVars: { rel: 0, modestbranding: 1 },
    events: {
      onReady: (e) => {
        ytDuration = e.target.getDuration();
        document.getElementById('audioTime').textContent = '0:00 / ' + fmt(ytDuration);
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) {
          isPlaying = true;
          clearInterval(ytUpdateInterval);
          ytUpdateInterval = setInterval(() => {
            if (!ytPlayer) return;
            const cur = ytPlayer.getCurrentTime();
            const dur = ytPlayer.getDuration() || ytDuration;
            if (dur) {
              ytDuration = dur;
              document.getElementById('audioFill').style.width = ((cur/dur)*100)+'%';
              document.getElementById('audioTime').textContent = fmt(cur)+' / '+fmt(dur);
            }
            highlightLine(cur);
          }, 250);
        } else {
          isPlaying = false;
          clearInterval(ytUpdateInterval);
        }
      },
      onError: (e) => {
        if ([150,151,153,101].includes(e.data)) {
          const wrap = document.getElementById('yt-embed-wrap');
          const vid = currentEntry ? extractVideoId(currentEntry.youtube_url) : null;
          wrap.style.cssText = 'display:flex;align-items:center;justify-content:center;padding:2rem;';
          wrap.innerHTML = vid
            ? `<a href="https://www.youtube.com/watch?v=${vid}" target="_blank" style="color:var(--gold);font-size:.95rem;text-decoration:none;">↗ Embedding disabled — watch on YouTube</a>`
            : '';
        }
      }
    }
  });
}

function highlightLine(currentTime) {
  if (!currentEntry) return;
  const timestamps = currentEntry.timestamps || [];
  if (!timestamps.length) return;

  // Find active timestamp index (chronological — handles repeats correctly)
  let activeTsIdx = 0;
  for (let i = 0; i < timestamps.length; i++) {
    if (timestamps[i].start <= currentTime) activeTsIdx = i;
    else break;
  }

  const activeLine = timestamps[activeTsIdx] ? timestamps[activeTsIdx].line : '';
  const isMusic = activeLine === '[music]';

  // Highlight lyric rows
  const lyricEls = document.querySelectorAll('#qvLyrics .lyric-text');
  const circleEls = document.querySelectorAll('#qvLyrics .tl-circle');

  if (isMusic) {
    // Deactivate all lyric lines and circles
    lyricEls.forEach(el => el.classList.remove('active'));
    circleEls.forEach(el => el.classList.remove('active'));
    // Highlight the music row that matches this timestamp index
    document.querySelectorAll('#qvLyrics .music-row').forEach(row => {
      row.classList.toggle('active', parseInt(row.dataset.tsIdx) === activeTsIdx);
    });
  } else {
    // Deactivate all music rows
    document.querySelectorAll('#qvLyrics .music-row').forEach(row => row.classList.remove('active'));
    // Find which lyric row index this corresponds to
    // Count only non-music timestamps up to activeTsIdx
    let lyricIdx = 0;
    for (let i = 0; i <= activeTsIdx; i++) {
      if (timestamps[i].line !== '[music]') lyricIdx = i - timestamps.slice(0, i).filter(t => t.line === '[music]').length;
    }
    lyricEls.forEach((el, i) => el.classList.toggle('active', i === lyricIdx));
    circleEls.forEach((el, i) => el.classList.toggle('active', i === lyricIdx));
  }
}

function stopYT() {
  clearInterval(ytUpdateInterval);
  try { if (ytPlayer) ytPlayer.stopVideo(); } catch(e) {}
  ytPlayer = null;
  isPlaying = false;
}

function seekAudio(e) {
  if (!ytPlayer || !ytDuration) return;
  const t = document.getElementById('audioTrack');
  const r = t.getBoundingClientRect();
  ytPlayer.seekTo(((e.clientX-r.left)/r.width)*ytDuration, true);
}

function extractVideoId(url) {
  try {
    const u = new URL(url);
    return u.searchParams.get('v') || u.pathname.split('/').pop();
  } catch { return null; }
}

function fmt(s) {
  if (!s||isNaN(s)) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

loadLibrary();
</script>
